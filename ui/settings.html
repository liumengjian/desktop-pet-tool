<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 12px 24px;
      background: #f7f6fa;
      color: #333;
    }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    .path-row { display: flex; gap: 8px; }
    .path-row input {
      flex: 1;
      height: 34px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 12px;
      background: #fff;
      outline: none;
    }
    .path-row button {
      height: 34px;
      padding: 0 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .path-row button:hover { background: #c2c4c3; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 13px;
    }
    .radio-row {
      display: flex;
      gap: 18px;
      margin-top: 6px;
      font-size: 13px;
    }
    .radio-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .radio-item input { cursor: pointer; }
    .tip { font-size: 11px; color: #aaa; margin-top: 4px; }
    .tips {
      font-size: 12px;
      margin-top: 24px;
    }
    .footer {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .footer button {
      height: 34px;
      padding: 0 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .footer button:hover { background: #c2c4c3; }
  </style>
</head>
<body>
  <div class="field">
    <label data-i18n="set.language">语言 / Language</label>
    <div class="radio-row">
      <label class="radio-item">
        <input type="radio" name="lang" value="zh" id="langZh"> 中文
      </label>
      <label class="radio-item">
        <input type="radio" name="lang" value="en" id="langEn"> English
      </label>
    </div>
    <div class="tip" data-i18n="set.langTip">切换后立即生效，菜单与悬浮球气泡都会跟着换。</div>
  </div>

  <div class="field">
    <label data-i18n="set.tempPath">临时文件存放路径</label>
    <div class="path-row">
      <input type="text" id="tempDir" readonly>
      <button id="browseBtn" data-i18n="common.browse">浏览</button>
    </div>
    <div class="tip" data-i18n="set.tempPathTip">生成的文件会先保存到这里，复制到剪贴板后可随时清理。</div>
  </div>

  <div class="field">
    <div class="checkbox-row">
      <input type="checkbox" id="alwaysOnTop">
      <label for="alwaysOnTop" style="margin:0;" data-i18n="set.alwaysOnTop">窗口始终置顶</label>
    </div>
  </div>

  <div class="field">
    <label data-i18n="set.closeTitle">点击悬浮球右上角关闭按钮时</label>
    <div class="radio-row">
      <label class="radio-item">
        <input type="radio" name="closeAction" value="quit" id="closeQuit"> <span data-i18n="set.closeQuit">直接退出</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="closeAction" value="tray" id="closeTray"> <span data-i18n="set.closeTray">最小化到系统托盘</span>
      </label>
    </div>
    <div class="tip" data-i18n="set.closeTip">最小化到托盘后，可从系统托盘图标点击恢复悬浮窗。</div>
  </div>

  <div class="tips" data-i18n="set.contact">
    如遇到问题，请联系：18725926908（电话&微信）、liumengjianguge@gmail.com（邮箱）
  </div>

  <div class="footer">
    <button class="btn-text" id="closeBtn" data-i18n="common.close">关闭</button>
    <button class="btn-primary" id="saveBtn" data-i18n="common.save">保存</button>
  </div>

  <script src="i18n.js"></script>
  <script>
    // Tauri 桥接层（接口保持 window.api.* 不变）
    window.api = {
      getConfig: () => window.__TAURI__.core.invoke('config_get'),
      setConfig: (cfg) => window.__TAURI__.core.invoke('config_set', { newCfg: cfg }),
      pickTempDir: () => window.__TAURI__.core.invoke('config_pick_temp_dir'),
      closeSettings: () => window.__TAURI__.core.invoke('close_settings')
    };

    const tempDirInput = document.getElementById('tempDir');
    const browseBtn = document.getElementById('browseBtn');
    const alwaysOnTop = document.getElementById('alwaysOnTop');
    const closeQuit = document.getElementById('closeQuit');
    const closeTray = document.getElementById('closeTray');
    const langZh = document.getElementById('langZh');
    const langEn = document.getElementById('langEn');
    const saveBtn = document.getElementById('saveBtn');
    const closeBtn = document.getElementById('closeBtn');

    // 加载当前配置（语言先落定，再显示其余文案）
    window.api.getConfig().then(cfg => {
      window.I18N.setLang(cfg.lang || 'zh');
      tempDirInput.value = cfg.tempDir;
      alwaysOnTop.checked = cfg.alwaysOnTop;
      if (cfg.closeToTray) closeTray.checked = true; else closeQuit.checked = true;
      if (cfg.lang === 'en') langEn.checked = true; else langZh.checked = true;
    });

    // 语言单独即时生效：切换即保存，其它窗口收到 config-changed 后同步换文案
    function onLangChange(value) {
      window.I18N.setLang(value);
      window.api.setConfig({ lang: value });
    }
    langZh.addEventListener('change', () => { if (langZh.checked) onLangChange('zh'); });
    langEn.addEventListener('change', () => { if (langEn.checked) onLangChange('en'); });

    browseBtn.addEventListener('click', async () => {
      const dir = await window.api.pickTempDir();
      if (dir) tempDirInput.value = dir;
    });

    saveBtn.addEventListener('click', async () => {
      await window.api.setConfig({
        tempDir: tempDirInput.value,
        alwaysOnTop: alwaysOnTop.checked,
        closeToTray: closeTray.checked
      });
      window.api.closeSettings();
    });

    closeBtn.addEventListener('click', () => window.api.closeSettings());
  </script>
</body>
</html>
