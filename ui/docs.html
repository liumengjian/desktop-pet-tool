<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文档工具</title>
  <link rel="stylesheet" href="docs.css">
</head>
<body>
  <div class="shell">
    <header class="head">
      <div class="title">文档工具</div>
      <div class="sub">压缩省体积，转换改格式 · 全部在本机完成，不依赖 Office / WPS</div>
    </header>

    <main id="stage">
      <!-- 第一步：文件 + 操作 -->
      <section class="panel" id="panelPick">
        <div class="panel-head">
          <span>待处理文件</span>
          <button class="ghost" id="btnAdd">选择文件</button>
        </div>
        <ul class="filelist" id="fileList">
          <li class="empty">把文件拖到悬浮球上，或点右上角「选择文件」</li>
        </ul>
        <div class="hint">单文件上限 2GB · PDF 超过 64MB 走流式处理，不占满内存</div>
      </section>

      <section class="panel" id="panelMode">
        <div class="panel-head"><span>要做什么</span></div>
        <div class="modes">
          <button class="mode" id="modeCompress" data-mode="compress">
            <b>压缩</b>
            <span>减小文件体积</span>
          </button>
          <button class="mode" id="modeConvert" data-mode="convert">
            <b>转换</b>
            <span>换成其他格式</span>
          </button>
        </div>

        <div class="sub" id="levelBox" hidden>
          <label>压缩强度</label>
          <div class="chips" id="levelChips">
            <button class="chip" data-level="small">更小</button>
            <button class="chip active" data-level="normal">标准</button>
            <button class="chip" data-level="high">更清晰</button>
          </div>
          <div class="hint">
            PDF 按页面尺寸推导图片上限；Office 重打包、压缩内嵌图并清理可选部件。
            以文字为主的文件本身已很小，压缩空间有限。
          </div>
        </div>

        <div class="sub" id="targetBox" hidden>
          <label>目标格式</label>
          <div class="chips" id="targetChips"></div>
          <div class="hint" id="targetHint"></div>
        </div>
      </section>

      <section class="notice" id="notice" hidden></section>
    </main>

    <footer class="footer" id="footerPick">
      <div class="foot-note" id="footNote"></div>
      <button class="primary" id="btnStart" disabled>开始处理</button>
    </footer>

    <!-- 进度 -->
    <section class="stage" id="stageRun" hidden>
      <div class="run-title" id="runTitle">正在处理</div>
      <div class="run-file" id="runFile"></div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="run-meta"><span id="runLabel"></span><span id="runPct">0%</span></div>
      <button class="ghost wide" id="btnCancel">取消</button>
    </section>

    <!-- 结果 -->
    <section class="stage" id="stageDone" hidden>
      <div class="done-title" id="doneTitle">处理完成</div>
      <div class="done-msg" id="doneMsg"></div>
      <ul class="resultlist" id="resultList"></ul>
      <div class="done-dir" id="doneDir"></div>
      <div class="done-actions">
        <button class="primary" id="btnOpenDir">打开输出文件夹</button>
        <button class="ghost" id="btnAgain">继续处理</button>
        <button class="ghost" id="btnClose">关闭</button>
      </div>
    </section>
  </div>

  <script src="docs.js"></script>
</body>
</html>
