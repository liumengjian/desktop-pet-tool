<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 输入气泡：对话冒泡形式，在主体上方弹出，主体不被遮盖 -->
  <div id="bubble" class="bubble hidden">
    <div class="bubble-header">
      <span class="bubble-title" data-i18n="input.title">粘贴文件链接</span>
      <button id="bubbleClose" class="bubble-close" data-i18n-title="common.hide" title="收起">×</button>
    </div>
    <input type="text" id="urlInput" class="url-input" placeholder="https://example.com/file.pdf" autocomplete="off" spellcheck="false">
    <div id="progressWrap" class="progress-wrap hidden">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text" data-i18n="input.prepare">准备中…</div>
    </div>
    <div id="statusText" class="status-text"></div>
  </div>

  <!-- 文档工具气泡：拖入文件后浮出，转换 / 压缩 → 选项 → 进度 → 完成，全在球边完成 -->
  <div id="docsBubble" class="bubble docs-bubble hidden">
    <div class="bubble-header">
      <div class="docs-head-left">
        <button id="docsBack" class="bubble-back hidden" data-i18n-title="docs.back" title="返回">‹</button>
        <span id="docsTitle" class="bubble-title" data-i18n="docs.title">文档工具</span>
      </div>
      <button id="docsClose" class="bubble-close" data-i18n-title="common.hide" title="收起">×</button>
    </div>
    <div id="docsBody">
      <div id="docsFiles" class="docs-files"></div>

      <div id="docsModes" class="docs-modes">
        <button id="docsModeConvert" class="mode-card">
          <span class="mode-name" data-i18n="docs.modeConvert">转换</span>
          <span class="mode-sub" data-i18n="docs.modeConvertSub">换成别的格式</span>
        </button>
        <button id="docsModeCompress" class="mode-card">
          <span class="mode-name" data-i18n="docs.modeCompress">压缩</span>
          <span class="mode-sub" data-i18n="docs.modeCompressSub">更小 / 标准 / 更清晰</span>
        </button>
      </div>

      <div id="docsTargets" class="chip-row hidden"></div>
      <div id="docsLevels" class="chip-row hidden">
        <button class="chip" data-level="small" data-i18n="docs.levelSmall">更小</button>
        <button class="chip active" data-level="normal" data-i18n="docs.levelNormal">标准</button>
        <button class="chip" data-level="high" data-i18n="docs.levelHigh">更清晰</button>
      </div>

      <!-- <div id="docsHint" class="docs-hint"></div> -->

      <div id="docsActions" class="docs-actions">
        <button id="docsPick" class="link-btn" data-i18n="docs.pick">选择文件</button>
        <button id="docsStart" class="primary-btn" data-i18n="docs.start" disabled>开始处理</button>
      </div>

      <div id="docsRun" class="hidden">
        <div id="docsRunName" class="docs-run-name"></div>
        <div class="progress-bar"><div id="docsRunFill" class="progress-fill"></div></div>
        <div class="docs-run-row">
          <span id="docsRunLabel"></span>
          <span id="docsRunPct">0%</span>
        </div>
        <div class="docs-actions">
          <button id="docsCancel" class="link-btn" data-i18n="common.cancel">取消</button>
        </div>
      </div>

      <div id="docsDone" class="hidden">
        <div id="docsDoneMsg" class="docs-done-msg"></div>
        <div id="docsResults" class="docs-results"></div>
        <div class="docs-actions">
          <button id="docsOpenDir" class="secondary-btn" data-i18n="docs.openDir">打开临时文件夹</button>
          <button id="docsAgain" class="primary-btn" data-i18n="docs.again">完成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 文件查找气泡：名称模糊匹配 → 来源文件夹（留空 = 只查本机） → 打开或定位 -->
  <div id="fsBubble" class="bubble fs-bubble hidden">
    <div class="bubble-header">
      <div class="docs-head-left">
        <span class="bubble-title" data-i18n="fs.title">文件查找</span>
      </div>
      <button id="fsClose" class="bubble-close" data-i18n-title="common.hide" title="收起">×</button>
    </div>
    <div id="fsBody">
      <input id="fsQuery" class="url-input fs-query" data-i18n-placeholder="fs.placeholder"
             placeholder="输入文件名关键词，支持模糊匹配" autocomplete="off" spellcheck="false">

      <div id="fsNetBox" class="fs-net">
        <input id="fsNetPath" class="url-input" data-i18n-placeholder="fs.netPlaceholder"
               placeholder="留空只查本机；也可填文件夹或 \\服务器\共享" autocomplete="off" spellcheck="false">
        <button id="fsNetPick" class="link-btn" data-i18n="fs.browse">选择</button>
      </div>

      <div id="fsHint" class="docs-hint"></div>

      <div class="docs-actions fs-actions">
        <span id="fsStat" class="fs-stat"></span>
        <button id="fsStart" class="primary-btn" data-i18n="fs.start" disabled>开始查找</button>
      </div>

      <div id="fsResults" class="fs-results"></div>
    </div>
  </div>

  <!-- 人脸比对气泡：两组照片各上传多张 → 跨组一一对应 → Word（每页一对） -->
  <div id="faceBubble" class="bubble face-bubble hidden">
    <div class="bubble-header">
      <div class="docs-head-left">
        <button id="faceBack" class="bubble-back hidden" data-i18n-title="face.back" title="返回">‹</button>
        <span id="faceTitle" class="bubble-title" data-i18n="face.title">人脸比对</span>
      </div>
      <button id="faceClose" class="bubble-close" data-i18n-title="common.hide" title="收起">×</button>
    </div>
    <div id="faceBody">
      <div id="faceGroups">
        <div class="face-group" data-group="a">
          <div class="face-group-head">
            <span class="face-group-name" data-i18n="face.groupA">第一组</span>
            <span id="faceCountA" class="face-count">0</span>
            <button id="facePickA" class="link-btn" data-i18n="face.pick">选择照片</button>
          </div>
          <div id="faceListA" class="face-list"></div>
        </div>
        <div class="face-group" data-group="b">
          <div class="face-group-head">
            <span class="face-group-name" data-i18n="face.groupB">第二组</span>
            <span id="faceCountB" class="face-count">0</span>
            <button id="facePickB" class="link-btn" data-i18n="face.pick">选择照片</button>
          </div>
          <div id="faceListB" class="face-list"></div>
        </div>
      </div>
      <div id="faceHint" class="docs-hint"></div>
      <div id="faceActions" class="docs-actions">
        <span></span>
        <button id="faceStart" class="primary-btn" data-i18n="face.start" disabled>开始比对</button>
      </div>

      <div id="faceRun" class="hidden">
        <div id="faceRunName" class="docs-run-name"></div>
        <div class="progress-bar"><div id="faceRunFill" class="progress-fill"></div></div>
        <div class="docs-run-row">
          <span id="faceRunLabel"></span>
          <span id="faceRunPct">0%</span>
        </div>
        <div class="docs-actions">
          <button id="faceCancel" class="link-btn" data-i18n="common.cancel">取消</button>
        </div>
      </div>

      <div id="faceDone" class="hidden">
        <div id="faceDoneMsg" class="docs-done-msg"></div>
        <div id="faceResults" class="docs-results"></div>
        <div class="docs-actions">
          <button id="faceOpenDir" class="secondary-btn" data-i18n="face.openDir">打开临时文件夹</button>
          <button id="faceAgain" class="primary-btn" data-i18n="face.again">完成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 图片水印去除气泡：选图 → 画笔 / 框选 mask → 模型修复 -->
  <div id="wmBubble" class="bubble wm-bubble hidden">
    <div class="bubble-header">
      <div class="docs-head-left">
        <button id="wmBack" class="bubble-back hidden" data-i18n-title="wm.back" title="返回">‹</button>
        <span id="wmTitle" class="bubble-title" data-i18n="wm.title">图片水印去除</span>
      </div>
      <button id="wmClose" class="bubble-close" data-i18n-title="common.hide" title="收起">×</button>
    </div>
    <div id="wmBody">
      <div id="wmPickRow" class="docs-actions">
        <button id="wmPick" class="link-btn" data-i18n="wm.pick">选择图片</button>
        <span id="wmFile" class="wm-file"></span>
      </div>

      <div id="wmEditor" class="wm-editor hidden">
        <div class="wm-toolbar">
          <button id="wmBrush" class="chip" data-i18n="wm.brush">画笔</button>
          <button id="wmRect" class="chip" data-i18n="wm.rect">框选</button>
          <input id="wmRadius" type="range" min="4" max="40" value="12" title="笔刷大小" disabled>
          <button id="wmUndo" class="link-btn" data-i18n="wm.undo">撤销</button>
          <button id="wmClear" class="link-btn" data-i18n="wm.clear">清空</button>
        </div>
        <div id="wmCanvasWrap" class="wm-canvas-wrap">
          <canvas id="wmImgCanvas" class="wm-canvas"></canvas>
          <canvas id="wmMarkCanvas" class="wm-canvas"></canvas>
        </div>
      </div>

      <div id="wmHint" class="docs-hint"></div>
      <div id="wmActions" class="docs-actions">
        <span></span>
        <button id="wmStart" class="primary-btn" data-i18n="wm.start" disabled>开始去除</button>
      </div>

      <div id="wmRun" class="hidden">
        <div id="wmRunName" class="docs-run-name"></div>
        <div class="progress-bar"><div id="wmRunFill" class="progress-fill"></div></div>
        <div class="docs-run-row">
          <span id="wmRunLabel"></span>
          <span id="wmRunPct">0%</span>
        </div>
        <div class="docs-actions">
          <button id="wmCancel" class="link-btn" data-i18n="common.cancel">取消</button>
        </div>
      </div>

      <div id="wmDone" class="hidden">
        <div id="wmDoneMsg" class="docs-done-msg"></div>
        <div id="wmResults" class="docs-results"></div>
        <div class="docs-actions">
          <button id="wmOpenDir" class="secondary-btn" data-i18n="wm.openDir">打开临时文件夹</button>
          <button id="wmAgain" class="primary-btn" data-i18n="wm.again">完成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 文件粉碎气泡：资源管理器右键带进来的文件 / 文件夹 → 确认 → 随机覆盖后删除 -->
  <div id="shredBubble" class="bubble shred-bubble hidden">
    <div class="bubble-header">
      <div class="docs-head-left">
        <span id="shredTitle" class="bubble-title" data-i18n="shred.title">文件粉碎</span>
      </div>
      <button id="shredClose" class="bubble-close" data-i18n-title="common.hide" title="收起">×</button>
    </div>
    <div id="shredBody">
      <div id="shredList" class="shred-list"></div>
      <div id="shredWarn" class="shred-warn"></div>
      <label id="shredOptRow" class="shred-opt">
        <input id="shredKillLocks" type="checkbox" checked>
        <span id="shredKillLocksText" data-i18n="shred.killLocks">被占用时结束占用进程</span>
      </label>

      <div id="shredActions" class="docs-actions">
        <span id="shredStat" class="shred-stat"></span>
        <button id="shredStart" class="primary-btn" data-i18n="shred.start" disabled>开始粉碎</button>
      </div>

      <div id="shredRun" class="hidden">
        <div id="shredRunName" class="docs-run-name"></div>
        <div class="progress-bar"><div id="shredRunFill" class="progress-fill"></div></div>
        <div class="docs-run-row">
          <span id="shredRunLabel"></span>
          <span id="shredRunPct">0%</span>
        </div>
        <div class="docs-actions">
          <button id="shredCancel" class="link-btn" data-i18n="shred.cancel">取消</button>
        </div>
      </div>

      <div id="shredDone" class="hidden">
        <div id="shredDoneMsg" class="docs-done-msg"></div>
        <div id="shredDoneNote" class="shred-stat"></div>
        <div id="shredDoneList" class="docs-results"></div>
        <div class="docs-actions">
          <span></span>
          <button id="shredAgain" class="primary-btn" data-i18n="shred.ok">完成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 圆形悬浮主体：由 emotion-ball 引擎绘制球体与表情，始终显示 -->
  <div id="floatButton" class="float-button">
    <button id="miniClose" class="mini-close" data-i18n-title="common.close" title="关闭">×</button>
    <div id="eb-render"></div>
  </div>

  <!-- 球体外圈的进度环 + 球下方百分比胶囊：文档任务进行中显示 -->
  <div id="ballProgress" class="ball-progress hidden">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring-track" cx="50" cy="50" r="46"></circle>
      <circle id="ringArc" class="ring-arc" cx="50" cy="50" r="46"></circle>
    </svg>
  </div>
  <div id="ballPctPill" class="ball-pct hidden"><span id="ballPct">0%</span></div>

  <!-- 消息提示气泡：清理完成、复制成功等（对话冒泡样式，默认隐藏） -->
  <div id="msgBubble" class="bubble msg-bubble hidden"></div>

  <!-- 文案字典（中 / 英）先于业务脚本加载 -->
  <script src="i18n.js"></script>

  <!-- emotion-ball 表情引擎（按依赖顺序加载：几何数据 → 表情数据 → 渲染层 → 驱动层） -->
  <script src="vendor/emotion-ball/rings.js"></script>
  <script src="vendor/emotion-ball/emotions.js"></script>
  <script src="vendor/emotion-ball/ball.js"></script>
  <script src="vendor/emotion-ball/engine.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
